<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  body{display:flex;flex-direction:column;background:#333}
  .icon{width:1024px;height:1024px;position:relative;overflow:hidden;flex:none}

  /* ---- Variant A: Neon jaw arc on deep navy ---- */
  #a{background:
      radial-gradient(720px 720px at 50% 30%, #232a3d 0%, transparent 70%),
      radial-gradient(900px 700px at 50% 115%, #1b2450 0%, transparent 65%),
      linear-gradient(160deg, #161b28 0%, #0d1019 100%);}

  /* ---- Variant B: Neumorphic light (matches in-app look) ---- */
  #b{background:linear-gradient(150deg,#eef1f8 0%,#dde3ef 100%)}
  #b .plate{position:absolute;inset:112px;border-radius:230px;background:#e3e8f2;
    box-shadow:34px 34px 70px rgba(163,177,198,.75), -34px -34px 70px rgba(255,255,255,.95)}

  /* ---- Variant C: Gradient field, white arc ---- */
  #c{background:linear-gradient(140deg,#17a0bf 0%, #4f6ad0 55%, #735ddb 100%)}
</style></head><body>

<!-- A -->
<div class="icon" id="a">
<svg width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd4f0"/><stop offset="1" stop-color="#8f6bff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd4f0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#2fd4f0" stop-opacity=".85"/>
      <stop offset="1" stop-color="#2fd4f0" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <!-- corner brackets -->
  <g stroke="#525c74" stroke-width="14" stroke-linecap="round" fill="none" opacity=".55">
    <path d="M148 258 V148 H258"/><path d="M766 148 H876 V258"/>
    <path d="M876 766 V876 H766"/><path d="M258 876 H148 V766"/>
  </g>

  <!-- scan line -->
  <rect x="112" y="536" width="800" height="10" fill="url(#scan)" filter="url(#blur2)"/>
  <rect x="152" y="539" width="720" height="4" fill="url(#scan)"/>

  <!-- landmark dots (upper face) -->
  <g fill="#6f7a96">
    <circle cx="400" cy="322" r="14"/><circle cx="624" cy="322" r="14"/>
    <circle cx="512" cy="428" r="11"/>
  </g>

  <!-- jaw arc: glow pass then crisp pass -->
  <path d="M 218 470 A 300 330 0 0 0 806 470" fill="none" stroke="url(#ga)"
        stroke-width="64" stroke-linecap="round" filter="url(#blur1)" opacity=".8"/>
  <path d="M 218 470 A 300 330 0 0 0 806 470" fill="none" stroke="url(#ga)"
        stroke-width="46" stroke-linecap="round"/>
  <!-- chin node -->
  <circle cx="512" cy="800" r="26" fill="#fff"/>
  <circle cx="512" cy="800" r="26" fill="url(#ga)" opacity=".35"/>
</svg>
</div>

<!-- B -->
<div class="icon" id="b">
<div class="plate"></div>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" style="position:absolute;inset:0">
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17a0bf"/><stop offset="1" stop-color="#735ddb"/>
    </linearGradient>
    <linearGradient id="scanb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17a0bf" stop-opacity="0"/>
      <stop offset=".5" stop-color="#17a0bf" stop-opacity=".55"/>
      <stop offset="1" stop-color="#17a0bf" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g stroke="#a7b1c7" stroke-width="13" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M226 320 V226 H320"/><path d="M704 226 H798 V320"/>
    <path d="M798 704 V798 H704"/><path d="M320 798 H226 V704"/>
  </g>
  <rect x="200" y="530" width="624" height="6" fill="url(#scanb)"/>
  <g fill="#8a94ad">
    <circle cx="424" cy="360" r="12"/><circle cx="600" cy="360" r="12"/>
    <circle cx="512" cy="446" r="10"/>
  </g>
  <path d="M 268 470 A 250 280 0 0 0 756 470" fill="none" stroke="url(#gb)"
        stroke-width="42" stroke-linecap="round"/>
  <circle cx="512" cy="746" r="20" fill="#735ddb"/>
</svg>
</div>

<!-- C -->
<div class="icon" id="c">
<svg width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="scanc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurc" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" opacity=".5">
    <path d="M148 258 V148 H258"/><path d="M766 148 H876 V258"/>
    <path d="M876 766 V876 H766"/><path d="M258 876 H148 V766"/>
  </g>
  <rect x="132" y="536" width="760" height="8" fill="url(#scanc)" filter="url(#blurc)"/>
  <g fill="#ffffff" opacity=".85">
    <circle cx="400" cy="330" r="13"/><circle cx="624" cy="330" r="13"/>
    <circle cx="512" cy="430" r="11"/>
  </g>
  <path d="M 218 470 A 300 330 0 0 0 806 470" fill="none" stroke="#0b1626"
        stroke-width="58" stroke-linecap="round" opacity=".25" filter="url(#blurc)"/>
  <path d="M 218 470 A 300 330 0 0 0 806 470" fill="none" stroke="#ffffff"
        stroke-width="46" stroke-linecap="round"/>
  <circle cx="512" cy="800" r="26" fill="#fff"/>
</svg>
</div>

</body></html>
