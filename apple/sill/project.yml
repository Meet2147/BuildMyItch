# XcodeGen spec for the Sill app. The project file is generated rather than
# checked in, so a merge conflict can never be in a .pbxproj.
#
#   brew install xcodegen && xcodegen generate && open Sill.xcodeproj
#
# Everything below is deliberately boring. The interesting parts of the app
# are in Sources/SillCore and App/Sill.

name: Sill
options:
  bundleIdPrefix: com.softstone
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SillCore:
    path: .

settings:
  base:
    # The app builds in Swift 5 language mode for now; SillCore is already
    # Swift 6 clean (see Package.swift). Flipping the app over is a task in
    # its own right and shouldn't be smuggled into the first build.
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""          # set yours, or leave blank and sign to run locally
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Sill:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sill
    dependencies:
      - package: SillCore
        product: SillCore
    info:
      path: App/Sill.plist
      properties:
        CFBundleDisplayName: Sill
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Sill has no reason to talk to anything, and the privacy label
        # should be able to say "Data Not Collected" literally.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Sill.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        # Uncomment once the CloudKit container exists — see architecture/SYNC.md
        # com.apple.developer.icloud-container-identifiers: [iCloud.com.softstone.sill]
        # com.apple.developer.icloud-services: [CloudKit]
        # com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Sill
        CODE_SIGN_ENTITLEMENTS: App/Sill.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
